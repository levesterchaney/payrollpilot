plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.4' apply false
    id 'io.spring.dependency-management' version '1.1.4' apply false
}

ext {
    set('springCloudVersion', "2023.0.1")
}

allprojects {
    group = 'com.payrollpilot'
    version = '1.0.0'
    
    repositories {
        mavenCentral()
    }
}

configure(subprojects.findAll { it.name != 'frontend' && it.name != 'services' && it.name != 'shared' }) {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
    
    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }
    
    dependencyManagement {
        imports {
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        }
    }
    
    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    
    tasks.named('test') {
        useJUnitPlatform()
    }
    
    // Skip bootJar task for modules without source files
    tasks.named('bootJar') {
        onlyIf {
            def srcDir = file('src/main/java')
            return srcDir.exists() && srcDir.listFiles()?.any { it.name.endsWith('.java') }
        }
    }
}

configure(subprojects.findAll { it.name == 'shared' }) {
    apply plugin: 'java'
    
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
    
    tasks.named('test') {
        useJUnitPlatform()
    }
}

configure(subprojects.findAll { it.path.startsWith(':services:') }) {
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'io.micrometer:micrometer-registry-prometheus'
    }
}